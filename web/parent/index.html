<!doctype html>
<!-- 2-D (Phase 2, 14.6): 家长端 — 仪表盘 + 授权管理 + 报告下载.
     数据只读 (roster/overview/report), 全部经 2-A guardian_learner_link
     授权链路; 页面守卫/带鉴权请求复用 /auth.js。纯静态实现 (与
     student/teacher legacy 页同风格, 无构建步骤)。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogEdu 家长端</title>
    <script src="/auth.js?v=2.0.0"></script>
    <style>
      body { font-family: system-ui, sans-serif; background: #f4f6f9; color: #2b3a4a;
             margin: 0; }
      header { background: #2f6fb2; color: #fff; padding: 14px 24px; display: flex;
               justify-content: space-between; align-items: center; }
      header h1 { font-size: 18px; margin: 0; }
      header button { background: rgba(255,255,255,.15); color: #fff; border: 1px solid
               rgba(255,255,255,.4); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
      main { max-width: 880px; margin: 24px auto; padding: 0 16px; }
      section { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06);
                padding: 20px 24px; margin-bottom: 20px; }
      h2 { font-size: 16px; margin: 0 0 14px; border-left: 4px solid #2f6fb2;
           padding-left: 10px; }
      .card { border: 1px solid #e3e9ef; border-radius: 8px; padding: 14px 16px;
              margin-bottom: 12px; }
      .card h3 { margin: 0 0 8px; font-size: 15px; }
      .muted { color: #7a8a9a; font-size: 13px; }
      .kpis { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0; }
      .kpi b { font-size: 18px; color: #2f6fb2; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #eef2f6; }
      th { color: #5a6b7d; font-weight: 600; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
               font-size: 12px; }
      .badge.pending { background: #fdf3e0; color: #b07d2b; }
      .badge.active { background: #e5f3e8; color: #2e7d43; }
      .badge.rejected, .badge.revoked { background: #f0f0f0; color: #888; }
      button.act { background: #2f6fb2; color: #fff; border: 0; border-radius: 6px;
                   padding: 7px 14px; cursor: pointer; font-size: 13px; }
      button.act.secondary { background: #fff; color: #2f6fb2; border: 1px solid #2f6fb2; }
      button.act.danger { background: #fff; color: #c0392b; border: 1px solid #c0392b; }
      button.act:disabled { opacity: .5; cursor: default; }
      label.chk { margin-right: 14px; font-size: 13px; }
      input[type=text] { padding: 8px 10px; border: 1px solid #ccd5dd; border-radius: 6px;
                         width: 200px; }
      #banner { display: none; margin: 0 0 16px; padding: 10px 14px; border-radius: 8px;
                font-size: 13px; }
      .err { background: #fdecea; color: #c0392b; }
      .ok { background: #e5f3e8; color: #2e7d43; }
      .detail { display: none; margin-top: 10px; border-top: 1px dashed #e3e9ef;
                padding-top: 10px; }
    </style>
  </head>
  <body>
    <header>
      <h1>CogEdu 家长端</h1>
      <div>
        <span id="who" class="muted" style="color:rgba(255,255,255,.8);margin-right:12px;"></span>
        <button id="btn-logout">退出登录</button>
      </div>
    </header>

    <main>
      <div id="banner"></div>

      <section>
        <h2>我的孩子</h2>
        <div id="roster"><p class="muted">加载中…</p></div>
      </section>

      <section>
        <h2>授权管理</h2>
        <div class="card">
          <b>发起绑定申请</b>
          <p class="muted">输入孩子的学生账号用户名，选择申请的权限；孩子在其学生端确认后生效。</p>
          <div style="margin:10px 0;">
            <input type="text" id="learner-username" placeholder="学生账号用户名" />
          </div>
          <div>
            <label class="chk"><input type="checkbox" value="view_progress" checked /> 查看学习进度</label>
            <label class="chk"><input type="checkbox" value="view_evidence" /> 查看证据链</label>
            <label class="chk"><input type="checkbox" value="download_report" checked /> 下载学习报告</label>
            <label class="chk"><input type="checkbox" value="receive_alerts" /> 接收预警</label>
          </div>
          <button class="act" id="btn-request" style="margin-top:12px;">提交申请</button>
        </div>
        <table id="links-table">
          <thead>
            <tr><th>孩子</th><th>权限</th><th>状态</th><th>申请时间</th><th></th></tr>
          </thead>
          <tbody id="links-body"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
        </table>
      </section>
    </main>

    <script>
      (function () {
        'use strict';
        var auth = window.CogEduAuth;
        var PERM_NAMES = {
          view_progress: '查看进度', view_evidence: '证据链',
          download_report: '下载报告', receive_alerts: '预警',
          assign_materials: '分配材料',
        };
        var STATUS_NAMES = { pending: '待确认', active: '已生效', rejected: '已拒绝', revoked: '已撤销' };

        function banner(msg, cls) {
          var el = document.getElementById('banner');
          el.textContent = msg;
          el.className = cls;
          el.style.display = 'block';
          setTimeout(function () { el.style.display = 'none'; }, 4000);
        }

        function api(path, opts) {
          opts = opts || {};
          opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
          return auth.authFetch('/api' + path, opts).then(function (r) {
            if (!r.ok) {
              return r.json().catch(function () { return {}; }).then(function (b) {
                throw new Error(b.error || ('请求失败 (HTTP ' + r.status + ')'));
              });
            }
            return r.json();
          });
        }

        // ── 我的孩子 (roster + overview 卡片) ─────────────────────────────
        function loadRoster() {
          return api('/parent/students').then(function (d) {
            var host = document.getElementById('roster');
            if (!d.students.length) {
              host.innerHTML = '<p class="muted">还没有关联的孩子 — 在下方「授权管理」发起绑定申请，孩子在学生端确认后即可看到学习概览。</p>';
              return;
            }
            host.innerHTML = '';
            d.students.forEach(function (s) {
              var card = document.createElement('div');
              card.className = 'card';
              card.innerHTML =
                '<h3>' + escapeHtml(s.student_id) + '</h3>' +
                '<div class="kpis">' +
                '<span>答题 <b>' + s.answered_count + '</b></span>' +
                '<span>正确率 <b>' + Math.round(s.correct_rate * 100) + '%</b></span>' +
                '<span>状态 <b>' + escapeHtml(s.current_state || '—') + '</b></span>' +
                '</div>' +
                '<div class="muted">最近活跃: ' + escapeHtml((s.last_active_at || '—').slice(0, 19)) + '</div>' +
                '<div style="margin-top:10px;">' +
                '<button class="act secondary" data-detail="' + escapeHtml(s.student_id) + '">学习概览</button>' +
                '<button class="act secondary" data-report="week" data-sid="' + escapeHtml(s.student_id) + '">下载周报</button>' +
                '<button class="act secondary" data-report="month" data-sid="' + escapeHtml(s.student_id) + '">下载月报</button>' +
                '</div>' +
                '<div class="detail" id="detail-' + escapeHtml(s.student_id) + '"><p class="muted">加载中…</p></div>';
              host.appendChild(card);
            });
            host.querySelectorAll('[data-detail]').forEach(function (btn) {
              btn.addEventListener('click', function () { toggleDetail(btn.getAttribute('data-detail'), btn); });
            });
            host.querySelectorAll('[data-report]').forEach(function (btn) {
              btn.addEventListener('click', function () {
                downloadReport(btn.getAttribute('data-sid'), btn.getAttribute('data-report'), btn);
              });
            });
          });
        }

        function toggleDetail(sid, btn) {
          var box = document.getElementById('detail-' + sid);
          if (box.style.display === 'block') { box.style.display = 'none'; return; }
          box.style.display = 'block';
          api('/parent/students/' + encodeURIComponent(sid) + '/overview').then(function (ov) {
            var five = ov.five_d || {};
            var mastery = five.mastery || {};
            var bloom = (five.bloom || {}).levels || {};
            var rows = Object.keys(mastery).map(function (k) {
              return '<tr><td>' + k + '</td><td>' + Number(mastery[k]).toFixed(3) + '</td></tr>';
            }).join('');
            var bloomRow = Object.keys(bloom).map(function (k) {
              return '<tr><td>' + k + '</td><td>' + Math.round((bloom[k] || 0) * 100) + '%</td></tr>';
            }).join('');
            box.innerHTML =
              '<div class="kpis"><span>总置信度 <b>' +
              Math.round((five.overall_confidence || 0) * 100) + '%</b></span></div>' +
              '<table><thead><tr><th>能力维度</th><th>theta</th></tr></thead><tbody>' + rows + '</tbody></table>' +
              '<p class="muted" style="margin:10px 0 4px;">Bloom 层级:</p>' +
              '<table><thead><tr><th>层级</th><th>掌握度</th></tr></thead><tbody>' + bloomRow + '</tbody></table>' +
              '<p class="muted" style="margin-top:8px;">近期干预: ' + (ov.interventions || []).length + ' 次</p>';
          }).catch(function (e) {
            box.innerHTML = '<p class="muted">概览加载失败: ' + escapeHtml(e.message) + '</p>';
          });
        }

        function downloadReport(sid, period, btn) {
          btn.disabled = true;
          auth.authFetch('/api/parent/students/' + encodeURIComponent(sid) + '/report?period=' + period)
            .then(function (r) {
              if (!r.ok) throw new Error('报告下载失败 (HTTP ' + r.status + ')');
              return r.blob();
            })
            .then(function (blob) {
              var a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = 'report_' + sid + '_' + period + '.docx';
              a.click();
              URL.revokeObjectURL(a.href);
            })
            .catch(function (e) { banner(e.message, 'err'); })
            .finally(function () { btn.disabled = false; });
        }

        // ── 授权管理 ──────────────────────────────────────────────────────
        function loadLinks() {
          return api('/guardian/links').then(function (d) {
            var body = document.getElementById('links-body');
            if (!d.links.length) {
              body.innerHTML = '<tr><td colspan="5" class="muted">暂无申请记录</td></tr>';
              return;
            }
            body.innerHTML = '';
            d.links.forEach(function (l) {
              var tr = document.createElement('tr');
              var perms = (l.permissions || []).map(function (p) { return PERM_NAMES[p] || p; }).join('、');
              var action = '';
              if (l.status === 'pending' || l.status === 'active') {
                action = '<button class="act danger" data-revoke="' + l.link_id + '">' +
                         (l.status === 'pending' ? '撤回申请' : '撤销授权') + '</button>';
              }
              tr.innerHTML =
                '<td>' + escapeHtml(l.learner_username || l.learner_student_id || '—') + '</td>' +
                '<td>' + escapeHtml(perms) + '</td>' +
                '<td><span class="badge ' + l.status + '">' + (STATUS_NAMES[l.status] || l.status) + '</span></td>' +
                '<td class="muted">' + escapeHtml((l.requested_at || '').slice(0, 19)) + '</td>' +
                '<td>' + action + '</td>';
              body.appendChild(tr);
            });
            body.querySelectorAll('[data-revoke]').forEach(function (btn) {
              btn.addEventListener('click', function () {
                api('/guardian/links/' + btn.getAttribute('data-revoke'), { method: 'DELETE' })
                  .then(function () { banner('已撤销，对方的访问立即失效', 'ok'); return loadLinks(); })
                  .catch(function (e) { banner(e.message, 'err'); });
              });
            });
          });
        }

        document.getElementById('btn-request').addEventListener('click', function () {
          var username = document.getElementById('learner-username').value.trim();
          if (!username) { banner('请输入学生账号用户名', 'err'); return; }
          var permissions = [];
          document.querySelectorAll('label.chk input:checked').forEach(function (c) {
            permissions.push(c.value);
          });
          if (!permissions.length) { banner('至少选择一项权限', 'err'); return; }
          api('/guardian/links', {
            method: 'POST',
            body: JSON.stringify({ learner_username: username, permissions: permissions }),
          }).then(function () {
            banner('申请已提交，等待孩子在学生端确认', 'ok');
            document.getElementById('learner-username').value = '';
            return loadLinks();
          }).catch(function (e) { banner(e.message, 'err'); });
        });

        function escapeHtml(s) {
          var d = document.createElement('div');
          d.textContent = s == null ? '' : String(s);
          return d.innerHTML;
        }

        // ── 启动 ──────────────────────────────────────────────────────────
        auth.requireLogin();
        var user = auth.getUser() || {};
        document.getElementById('who').textContent =
          (user.display_name || user.username || '') + (user.role === 'guardian' ? ' 家长' : '');
        document.getElementById('btn-logout').addEventListener('click', auth.logout);
        loadRoster().catch(function (e) { banner(e.message, 'err'); });
        loadLinks().catch(function (e) { banner(e.message, 'err'); });
      })();
    </script>
  </body>
</html>
