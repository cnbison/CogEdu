<!doctype html>
<!-- 2-D (Phase 2, 14.6): 学生端授权确认页 — 家长绑定申请的确认/拒绝 +
     已生效授权的撤销。授权建立是"学生本人确认制"(2-A-3), 本页是确认
     环节的 UI; 纯静态实现, 守卫/带鉴权请求复用 /auth.js。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>家长授权管理 — CogEdu 学生端</title>
    <script src="/auth.js?v=2.0.0"></script>
    <style>
      body { font-family: system-ui, sans-serif; background: #f4f6f9; color: #2b3a4a; margin: 0; }
      header { background: #2f6fb2; color: #fff; padding: 14px 24px; display: flex;
               justify-content: space-between; align-items: center; }
      header h1 { font-size: 17px; margin: 0; }
      header a { color: #fff; font-size: 13px; }
      main { max-width: 720px; margin: 24px auto; padding: 0 16px; }
      section { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.06);
                padding: 20px 24px; margin-bottom: 20px; }
      h2 { font-size: 15px; margin: 0 0 12px; border-left: 4px solid #2f6fb2; padding-left: 10px; }
      .muted { color: #7a8a9a; font-size: 13px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eef2f6; vertical-align: top; }
      th { color: #5a6b7d; font-weight: 600; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
      .badge.pending { background: #fdf3e0; color: #b07d2b; }
      .badge.active { background: #e5f3e8; color: #2e7d43; }
      .badge.rejected, .badge.revoked { background: #f0f0f0; color: #888; }
      button.act { border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer;
                   font-size: 13px; margin-right: 6px; }
      .confirm { background: #2e7d43; color: #fff; }
      .reject { background: #fff; color: #c0392b; border: 1px solid #c0392b; }
      #banner { display: none; margin: 0 0 16px; padding: 10px 14px; border-radius: 8px; font-size: 13px; }
      .err { background: #fdecea; color: #c0392b; }
      .ok { background: #e5f3e8; color: #2e7d43; }
    </style>
  </head>
  <body>
    <header>
      <h1>家长授权管理</h1>
      <a href="/student/">← 返回学习页</a>
    </header>
    <main>
      <div id="banner"></div>
      <section>
        <h2>待我确认的申请</h2>
        <table id="pending-table">
          <thead><tr><th>家长</th><th>申请权限</th><th>申请时间</th><th>操作</th></tr></thead>
          <tbody><tr><td colspan="4" class="muted">加载中…</td></tr></tbody>
        </table>
        <p class="muted" style="margin-top:10px;">
          确认后家长即可按申请的权限查看你的学习数据；你随时可以在下方撤销，撤销立即生效。
        </p>
      </section>
      <section>
        <h2>全部授权记录</h2>
        <table id="links-table">
          <thead><tr><th>家长</th><th>权限</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
          <tbody><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
        </table>
      </section>
    </main>

    <script>
      (function () {
        'use strict';
        var auth = window.CogEduAuth;
        var PERM_NAMES = {
          view_progress: '查看进度', view_evidence: '证据链',
          download_report: '下载报告', receive_alerts: '预警', assign_materials: '分配材料',
        };
        var STATUS_NAMES = { pending: '待确认', active: '已生效', rejected: '已拒绝', revoked: '已撤销' };

        function banner(msg, cls) {
          var el = document.getElementById('banner');
          el.textContent = msg;
          el.className = cls;
          el.style.display = 'block';
          setTimeout(function () { el.style.display = 'none'; }, 4000);
        }

        function api(path, opts) {
          opts = opts || {};
          opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
          return auth.authFetch('/api' + path, opts).then(function (r) {
            if (!r.ok) {
              return r.json().catch(function () { return {}; }).then(function (b) {
                throw new Error(b.error || ('请求失败 (HTTP ' + r.status + ')'));
              });
            }
            return r.json();
          });
        }

        function guardianLabel(l) {
          return l.guardian_display_name || l.guardian_username || '家长';
        }

        function permLabel(l) {
          return (l.permissions || []).map(function (p) { return PERM_NAMES[p] || p; }).join('、') || '—';
        }

        function act(linkId, path, method, doneMsg) {
          api('/student/guardian-links/' + linkId + path, { method: method })
            .then(function () { banner(doneMsg, 'ok'); return load(); })
            .catch(function (e) { banner(e.message, 'err'); });
        }

        function renderRow(l, withActions) {
          var tr = document.createElement('tr');
          var ops = '';
          if (withActions && l.status === 'pending') {
            ops = '<button class="act confirm" data-act="/confirm" data-id="' + l.link_id + '">确认</button>' +
                  '<button class="act reject" data-act="/reject" data-id="' + l.link_id + '">拒绝</button>';
          } else if (l.status === 'active') {
            ops = '<button class="act reject" data-act="" data-method="DELETE" data-id="' + l.link_id + '">撤销</button>';
          }
          tr.innerHTML =
            '<td>' + escapeHtml(guardianLabel(l)) + '</td>' +
            '<td>' + escapeHtml(permLabel(l)) + '</td>' +
            (withActions ? '<td><span class="badge ' + l.status + '">' + (STATUS_NAMES[l.status] || l.status) + '</span></td>' : '') +
            '<td class="muted">' + escapeHtml((l.requested_at || '').slice(0, 19)) + '</td>' +
            '<td>' + ops + '</td>';
          return tr;
        }

        function load() {
          return api('/student/guardian-links').then(function (d) {
            var pendingBody = document.querySelector('#pending-table tbody');
            var allBody = document.querySelector('#links-table tbody');
            pendingBody.innerHTML = '';
            allBody.innerHTML = '';
            var pending = (d.links || []).filter(function (l) { return l.status === 'pending'; });
            if (!pending.length) {
              pendingBody.innerHTML = '<tr><td colspan="4" class="muted">暂无待确认的申请</td></tr>';
            } else {
              pending.forEach(function (l) { pendingBody.appendChild(renderRow(l, false)); });
            }
            if (!(d.links || []).length) {
              allBody.innerHTML = '<tr><td colspan="5" class="muted">暂无授权记录</td></tr>';
            } else {
              d.links.forEach(function (l) { allBody.appendChild(renderRow(l, true)); });
            }
            document.querySelectorAll('[data-id]').forEach(function (btn) {
              btn.addEventListener('click', function () {
                var path = btn.getAttribute('data-act');
                var method = btn.getAttribute('data-method') || 'POST';
                var done = path === '/confirm' ? '已确认，家长现在可以查看你的学习数据'
                         : path === '/reject' ? '已拒绝该申请'
                         : '已撤销，对方访问立即失效';
                act(btn.getAttribute('data-id'), path, method, done);
              });
            });
          });
        }

        function escapeHtml(s) {
          var d = document.createElement('div');
          d.textContent = s == null ? '' : String(s);
          return d.innerHTML;
        }

        auth.requireLogin();
        load().catch(function (e) { banner(e.message, 'err'); });
      })();
    </script>
  </body>
</html>
