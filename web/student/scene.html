<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>讲解场景 - CogEdu 学生端</title>
<link rel="stylesheet" href="/student/scene.css?v=1.1.0">
<!-- KaTeX (1-E-2): 公式渲染. 本地 vendor (2026-09-14, npmmirror 拉取的
     katex@0.16.11 dist 原样拷贝, 来源与版本见本注释)——此前走 jsdelivr
     CDN, 国内网络下加载失败会让全部公式降级为等宽源码直出 (3-G 验收
     实测暴露)。本地文件免去 CDN 依赖; 渲染失败仍有等宽文本兜底。 -->
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script src="/auth.js?v=2.0.0"></script>
<!-- Phase 3 (3-B/3-C): 公式共享模块 → 播放引擎 → 白板组件 → 场景页.
     defer 按文档顺序执行, 依赖方必须在前; 任何一环加载失败 scene.js
     均有守卫退回纯翻页模式 (Phase 1 行为) -->
<script src="/student/formula.js?v=1.0.0" defer></script>
<script src="/student/playback.js?v=1.0.0" defer></script>
<script src="/student/whiteboard.js?v=1.0.1" defer></script>
<script src="/student/scene.js?v=1.2.0" defer></script>
</head>
<body>

<div class="scene-topbar">
  <div class="wrap">
    <a class="back" href="/student/">← 返回学习</a>
    <span class="sid-pill">👤 <span id="scene-sid">—</span></span>
  </div>
</div>

<div class="wrap">

  <!-- 加载 / 错误态 -->
  <div id="scene-status" class="scene-status">
    <div class="spinner"></div>
    <p id="scene-status-text">正在为你准备讲解…</p>
    <button id="scene-retry" class="btn" style="display:none;" onclick="location.reload()">重试</button>
  </div>

  <!-- 场景播放区 (1-E-1: 翻页式, 不做播放状态机) -->
  <div id="scene-view" style="display:none;">
    <header class="scene-header">
      <h2 id="scene-outline-title">—</h2>
      <span class="progress" id="scene-progress">1 / 1</span>
    </header>

    <!-- 1-E-4: degraded 场景提示 (1-D-3 降级留痕的学生端呈现) -->
    <div id="scene-degraded-banner" class="degraded-banner" style="display:none;">
      ⚠️ 本页为简化讲解（自动生成遇到问题已降级），内容可能不完整。
    </div>

    <article id="scene-content" class="scene-card">
      <!-- blocks 由 scene.js 渲染: text (KaTeX) + image (懒加载/占位) -->
    </article>

    <!-- Phase 3 (3-B): 白板讲解区 — 仅 scene.actions 非空时显示
         (schema_version 2; Phase 1 旧场景 actions=None 保持纯翻页) -->
    <div id="wb-section" style="display:none;">
      <div id="wb-controls" class="wb-controls">
        <button id="wb-play" class="btn btn-primary" onclick="togglePlay()">▶ 播放讲解</button>
        <button id="wb-replay" class="btn" style="display:none;" onclick="replayPage()">↻ 重播本页</button>
      </div>
      <div id="wb-container" class="wb-container"><!-- 白板由 whiteboard.js 挂载 --></div>
      <!-- 语音字幕 (3-C-3): 无音频时估算计时器静音推进, 字幕同步展示讲解词 -->
      <div id="wb-subtitle" class="wb-subtitle" style="display:none;"></div>
    </div>

    <footer class="scene-pager">
      <button id="scene-prev" class="btn" onclick="prevScene()" disabled>← 上一页</button>
      <button id="scene-next" class="btn btn-primary" onclick="nextScene()">下一页 →</button>
    </footer>
  </div>

</div>
</body>
</html>
